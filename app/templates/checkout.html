<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOnline | Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#2563eb',
                        'secondary-blue': '#1d4ed8',
                        'accent-orange': '#f59e0b',
                        'neutral-gray': '#6b7280',
                        'background': '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        /* Minimal custom styles for animations and special effects */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        .notification {
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-blue to-secondary-blue font-sans m-0 p-0 min-h-screen flex items-center justify-center relative overflow-hidden">
    <header class="bg-gradient-to-br from-primary-blue to-secondary-blue text-white py-4 shadow-lg">
        <div class="max-w-6xl mx-auto px-8 flex justify-between items-center flex-wrap gap-4">
            <a href="{{ url_for('shop.shop') }}" class="text-white no-underline">
                <h1 class="text-4xl font-black m-0 cursor-pointer transition-transform duration-300 ease-in-out hover:scale-105">tech<span class="text-accent-orange">O</span>nline</h1>
            </a>
            <div class="flex items-center gap-4 ml-auto">
                <!-- Cart Icon with Badge -->
                <div class="relative">
                    <a href="{{ url_for('cart.cart') }}" class="flex items-center justify-center w-10 h-10 bg-white bg-opacity-20 hover:bg-opacity-30 text-white rounded-full transition-all duration-300 ease-in-out hover:scale-105">
                        <i class="fas fa-shopping-cart text-lg"></i>
                    </a>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center min-w-[20px] px-1">{{ cart_item_count }}</span>
                </div>
                
                <!-- Menu Dropdown -->
                <div class="relative">
                    <button id="cartDropdownBtn" type="button" class="flex items-center gap-2 bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-2xl font-medium transition-all duration-300 ease-in-out">
                        <i class="fas fa-bars"></i>
                        Menu
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>
                    <div id="cartDropdownMenu" class="hidden absolute right-0 top-full mt-2 w-52 bg-white text-black rounded-xl shadow-xl overflow-hidden z-50">
                        <a href="{{ url_for('profile.customer_profile') }}" class="block px-4 py-3 hover:bg-gray-100 no-underline text-black"><i class="fas fa-user mr-2"></i> Profile</a>
                        <a href="{{ url_for('shop.shop') }}" class="block px-4 py-3 hover:bg-gray-100 no-underline text-black"><i class="fas fa-store mr-2"></i> Shop</a>
                        <a href="{{ url_for('products.product_form') }}" class="block px-4 py-3 hover:bg-gray-100 no-underline text-black"><i class="fas fa-plus mr-2"></i> Add Product</a>
                        <a href="{{ url_for('logout') }}" class="block px-4 py-3 hover:bg-gray-100 no-underline text-black"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
</body>
</html>
